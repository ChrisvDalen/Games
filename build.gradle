plugins {
    id 'java'
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    group = 'com.keplersharvest'
    version = '0.1.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:all' << '-Xlint:-serial' << '-Xlint:-this-escape'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat = 'full'
        }
        finalizedBy tasks.named('jacocoTestReport')
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        // Byte-identical jars for identical input, so a rebuild can be compared against a release.
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.withType(JacocoReport).configureEach {
        // XML for CI to read, HTML for a human to browse.
        reports {
            xml.required = true
            html.required = true
        }
    }
}

/**
 * Regenerates assets/ui/pixel-font.{png,fnt} from the glyph table in PixelGlyphs.java.
 * The game does load these; they are build output from data committed in this repository.
 */
tasks.register('generatePixelFont', JavaExec) {
    group = 'assets'
    description = 'Regenerates the pixel font atlas and descriptor from the committed glyph table.'
    classpath = project(':core').sourceSets.main.runtimeClasspath
    mainClass = 'com.keplersharvest.tools.PixelFontGenerator'
    args rootProject.file('assets').absolutePath
}

tasks.register('generateTilesetImage', JavaExec) {
    group = 'assets'
    description = 'Regenerates assets/maps/meridian_tileset.png from the colours in the .tsj tileset.'
    classpath = project(':core').sourceSets.main.runtimeClasspath
    mainClass = 'com.keplersharvest.tools.TilesetImageGenerator'
    args rootProject.file('assets').absolutePath
}
