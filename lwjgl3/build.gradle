plugins {
    id 'application'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'com.keplersharvest.lwjgl3.DesktopLauncher'
}

sourceSets {
    main {
        // Bundles assets/ into the runnable jar so the game also works outside Gradle.
        resources.srcDir rootProject.file('assets')
    }
}

tasks.named('run', JavaExec) {
    // libGDX convention: the assets directory is the working directory.
    workingDir = rootProject.file('assets')
    setIgnoreExitValue true
}

tasks.register('fatJar', Jar) {
    group = 'distribution'
    description = 'Builds a self-contained runnable jar in lwjgl3/build/libs.'
    archiveBaseName = 'keplers-harvest'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
}
