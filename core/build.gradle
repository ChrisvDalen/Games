plugins {
    id 'java-library'
}

dependencies {
    api libs.gdx

    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

/**
 * Writes the project version into a generated source file so that save files stamp the version
 * the build actually produced. Keeping it generated stops the constant drifting from the version
 * declared in the root build script.
 */
def generatedSourceDir = layout.buildDirectory.dir('generated/sources/buildinfo/java/main')

def generateBuildInfo = tasks.register('generateBuildInfo') {
    description = 'Generates com.keplersharvest.BuildInfo from the project version.'
    def version = providers.provider { project.version.toString() }
    def outputDir = generatedSourceDir
    inputs.property('version', version)
    outputs.dir(outputDir)
    doLast {
        def packageDir = outputDir.get().asFile.toPath().resolve('com/keplersharvest')
        java.nio.file.Files.createDirectories(packageDir)
        packageDir.resolve('BuildInfo.java').setText("""\
package com.keplersharvest;

/** Build-time constants. Generated by the {@code generateBuildInfo} Gradle task - do not edit. */
public final class BuildInfo {

    /** The version this build was produced from, as declared in the root build script. */
    public static final String VERSION = "${version.get()}";

    private BuildInfo() {
    }
}
""", 'UTF-8')
    }
}

sourceSets.main.java.srcDir generateBuildInfo

tasks.named('test') {
    // Domain tests read the real content files so that shipped JSON is validated too.
    systemProperty 'keplersharvest.assets', rootProject.file('assets').absolutePath
    // Lets a test assert that the generated version matches the one Gradle knows about.
    systemProperty 'keplersharvest.expectedVersion', project.version.toString()
}
