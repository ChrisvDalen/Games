plugins {
    id 'java-library'
}

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"

    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    // Domain tests read the real content files so that shipped JSON is validated too.
    systemProperty 'keplersharvest.assets', rootProject.file('assets').absolutePath
}
