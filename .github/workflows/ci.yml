name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            */build/reports/tests/test
            */build/test-results/test
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '*/build/reports/jacoco/test'
          if-no-files-found: ignore

  smoke-test:
    name: Boot the game headless
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # LWJGL needs a display and a GL implementation. Xvfb provides the first,
      # Mesa's software rasteriser the second, so the real renderer runs on a
      # machine with no GPU.
      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri mesa-utils libglu1-mesa

      - name: Build the runnable jar
        run: ./gradlew :lwjgl3:fatJar --stacktrace

      - name: Boot the game and screenshot it
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          cd assets
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            java -jar ../lwjgl3/build/libs/keplers-harvest-*-all.jar --smoke-test 12

      - name: Check the screenshots were written
        run: |
          for shot in assets/smoke-world.png assets/smoke-test.png; do
            if [ ! -s "$shot" ]; then
              echo "::error::$shot was not written - the game did not render"
              exit 1
            fi
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: assets/smoke-*.png
          if-no-files-found: warn
