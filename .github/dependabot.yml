version: 2

updates:
  # libGDX and JUnit. Versions live in gradle.properties (gdxVersion, junitVersion)
  # and are referenced from core/build.gradle and lwjgl3/build.gradle.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Keeps the workflow in .github/workflows current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
